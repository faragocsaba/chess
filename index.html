/**
 * Chessboard UI & Interaction Handler
 * Handles board rendering, drag-and-drop, tap/click movement, visual highlights,
 * promotion modal, captured pieces, and move history.
 */



class ChessUI {
    constructor({ onMove, onPromotionSelect, onNewGame, onUndo, onFlipBoard, onMuteToggle, onExportPgn, onCopyFen, onDifficultyChange }) {
        this.onMove = onMove;
        this.onPromotionSelect = onPromotionSelect;
        this.onNewGame = onNewGame;
        this.onUndo = onUndo;
        this.onFlipBoard = onFlipBoard;
        this.onMuteToggle = onMuteToggle;
        this.onExportPgn = onExportPgn;
        this.onCopyFen = onCopyFen;
        this.onDifficultyChange = onDifficultyChange;

        // UI State
        this.flipped = false; // false = White at bottom, true = Black at bottom
        this.selectedSquare = null; // { r, c }
        this.legalMovesForSelected = [];
        this.draggedSquare = null;
        this.pendingPromotion = null; // { move }
        this.lastMove = null; // { from, to }

        // DOM Elements
        this.boardEl = document.getElementById('chess-board');
        this.statusBadgeEl = document.getElementById('status-badge');
        this.turnIndicatorEl = document.getElementById('turn-indicator');
        this.moveListEl = document.getElementById('move-list');
        this.capturedWhiteEl = document.getElementById('captured-white');
        this.capturedBlackEl = document.getElementById('captured-black');
        this.materialAdvWhiteEl = document.getElementById('material-adv-white');
        this.materialAdvBlackEl = document.getElementById('material-adv-black');
        this.promotionModalEl = document.getElementById('promotion-modal');
        this.promotionChoicesEl = document.getElementById('promotion-choices');
        this.gameOverModalEl = document.getElementById('game-over-modal');
        this.gameOverTitleEl = document.getElementById('game-over-title');
        this.gameOverDescEl = document.getElementById('game-over-desc');
        this.aiThinkingEl = document.getElementById('ai-thinking-indicator');
        this.toastEl = document.getElementById('toast');

        this._bindEvents();
    }

    _bindEvents() {
        // Controls
        document.getElementById('btn-new-game')?.addEventListener('click', () => this.showNewGameModal());
        document.getElementById('btn-undo')?.addEventListener('click', () => this.onUndo());
        document.getElementById('btn-flip')?.addEventListener('click', () => this.toggleFlip());
        document.getElementById('btn-sound')?.addEventListener('click', (e) => this.onMuteToggle(e.currentTarget));
        document.getElementById('btn-export-pgn')?.addEventListener('click', () => this.onExportPgn());
        document.getElementById('btn-copy-fen')?.addEventListener('click', () => this.onCopyFen());

        const diffSelect = document.getElementById('ai-difficulty-select');
        if (diffSelect) {
            diffSelect.addEventListener('change', (e) => {
                this.onDifficultyChange(parseInt(e.target.value, 10));
            });
        }

        // New Game Modal Buttons
        document.getElementById('modal-btn-start')?.addEventListener('click', () => {
            const side = document.querySelector('input[name="player-side"]:checked')?.value || 'white';
            const diff = parseInt(document.getElementById('modal-diff-select')?.value || '3', 10);
            this.hideNewGameModal();
            this.onNewGame({ side, difficulty: diff });
        });
        document.getElementById('modal-btn-cancel')?.addEventListener('click', () => this.hideNewGameModal());

        // Game Over Play Again Button
        document.getElementById('btn-play-again')?.addEventListener('click', () => {
            this.hideGameOverModal();
            this.showNewGameModal();
        });

        // Board click handler (fallback & click-to-move)
        this.boardEl.addEventListener('click', (e) => this._handleBoardClick(e));

        // Touch event support for mobile drag-and-drop
        this._bindTouchEvents();
    }

    setFlipped(flipped) {
        this.flipped = flipped;
        this.renderBoard();
    }

    toggleFlip() {
        this.flipped = !this.flipped;
        this.renderBoard();
        if (this.onFlipBoard) this.onFlipBoard(this.flipped);
    }

    setEngine(engine) {
        this.engine = engine;
    }

    /**
     * Re-renders the entire chessboard grid
     */
    renderBoard() {
        if (!this.engine) return;

        this.boardEl.innerHTML = '';
        const board = this.engine.board;
        const kingPos = this.engine.isInCheck() ? this.engine.findKing(this.engine.turn) : null;

        for (let rowIdx = 0; rowIdx < 8; rowIdx++) {
            const r = this.flipped ? 7 - rowIdx : rowIdx;

            for (let colIdx = 0; colIdx < 8; colIdx++) {
                const c = this.flipped ? 7 - colIdx : colIdx;
                const square = document.createElement('div');
                square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                square.dataset.r = r;
                square.dataset.c = c;
                square.dataset.coord = this.engine.coordsToAlgebraic(r, c);

                // Coordinate labels
                if (colIdx === 0) {
                    const rankLabel = document.createElement('span');
                    rankLabel.className = 'coord-label rank-label';
                    rankLabel.textContent = (8 - r);
                    square.appendChild(rankLabel);
                }
                if (rowIdx === 7) {
                    const fileLabel = document.createElement('span');
                    fileLabel.className = 'coord-label file-label';
                    fileLabel.textContent = String.fromCharCode(97 + c);
                    square.appendChild(fileLabel);
                }

                // Selected highlight
                if (this.selectedSquare && this.selectedSquare.r === r && this.selectedSquare.c === c) {
                    square.classList.add('selected');
                }

                // Last move highlights
                if (this.lastMove) {
                    if ((this.lastMove.from.r === r && this.lastMove.from.c === c) ||
                        (this.lastMove.to.r === r && this.lastMove.to.c === c)) {
                        square.classList.add('last-move');
                    }
                }

                // Check indicator
                if (kingPos && kingPos.r === r && kingPos.c === c) {
                    square.classList.add('in-check');
                }

                // Piece rendering
                const piece = board[r][c];
                if (piece) {
                    const pieceEl = document.createElement('div');
                    pieceEl.className = 'piece';
                    pieceEl.draggable = true;
                    pieceEl.dataset.r = r;
                    pieceEl.dataset.c = c;
                    pieceEl.innerHTML = getPieceSvg(`${piece.color}${piece.type.toUpperCase()}`);

                    this._bindPieceDrag(pieceEl, r, c);
                    square.appendChild(pieceEl);
                }

                // Legal move markers
                const legalMove = this.legalMovesForSelected.find(m => m.to.r === r && m.to.c === c);
                if (legalMove) {
                    const marker = document.createElement('div');
                    if (piece || legalMove.isEnPassant) {
                        marker.className = 'move-marker capture-marker';
                    } else {
                        marker.className = 'move-marker empty-marker';
                    }
                    square.appendChild(marker);
                }

                // Drop target events
                this._bindSquareDrop(square, r, c);

                this.boardEl.appendChild(square);
            }
        }
    }

    _bindPieceDrag(pieceEl, r, c) {
        pieceEl.addEventListener('dragstart', (e) => {
            const piece = this.engine.board[r][c];
            if (!piece || piece.color !== this.engine.turn) {
                e.preventDefault();
                return;
            }

            this.draggedSquare = { r, c };
            this.selectedSquare = { r, c };
            this.legalMovesForSelected = this.engine.getLegalMoves(r, c);
            this.renderBoard();

            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', `${r},${c}`);
            pieceEl.classList.add('dragging');
        });

        pieceEl.addEventListener('dragend', () => {
            pieceEl.classList.remove('dragging');
            this.draggedSquare = null;
        });
    }

    _bindSquareDrop(square, r, c) {
        square.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        });

        square.addEventListener('drop', (e) => {
            e.preventDefault();
            if (!this.draggedSquare) return;

            const fromR = this.draggedSquare.r;
            const fromC = this.draggedSquare.c;
            this.draggedSquare = null;

            this._attemptMove(fromR, fromC, r, c);
        });
    }

    _bindTouchEvents() {
        let touchStartPiece = null;
        let touchStartSquare = null;

        this.boardEl.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            const square = target ? target.closest('.square') : null;
            if (!square) return;

            const r = parseInt(square.dataset.r, 10);
            const c = parseInt(square.dataset.c, 10);
            const piece = this.engine ? this.engine.board[r][c] : null;

            if (piece && piece.color === this.engine.turn) {
                touchStartSquare = { r, c };
                touchStartPiece = square.querySelector('.piece');
            }
        }, { passive: true });

        this.boardEl.addEventListener('touchend', (e) => {
            if (!touchStartSquare) return;
            const touch = e.changedTouches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            const square = target ? target.closest('.square') : null;

            if (square) {
                const toR = parseInt(square.dataset.r, 10);
                const toC = parseInt(square.dataset.c, 10);
                if (toR !== touchStartSquare.r || toC !== touchStartSquare.c) {
                    this._attemptMove(touchStartSquare.r, touchStartSquare.c, toR, toC);
                } else {
                    this._handleSquareSelection(toR, toC);
                }
            }
            touchStartSquare = null;
            touchStartPiece = null;
        });
    }

    _handleBoardClick(e) {
        const square = e.target.closest('.square');
        if (!square) return;

        const r = parseInt(square.dataset.r, 10);
        const c = parseInt(square.dataset.c, 10);

        this._handleSquareSelection(r, c);
    }

    _handleSquareSelection(r, c) {
        const piece = this.engine.board[r][c];

        // If square already selected, and user clicks legal target
        if (this.selectedSquare) {
            const legalMove = this.legalMovesForSelected.find(m => m.to.r === r && m.to.c === c);
            if (legalMove) {
                this._attemptMove(this.selectedSquare.r, this.selectedSquare.c, r, c);
                return;
            }
        }

        // If clicking own piece, select it
        if (piece && piece.color === this.engine.turn) {
            this.selectedSquare = { r, c };
            this.legalMovesForSelected = this.engine.getLegalMoves(r, c);
            this.renderBoard();
        } else {
            // Deselect
            this.selectedSquare = null;
            this.legalMovesForSelected = [];
            this.renderBoard();
        }
    }

    _attemptMove(fromR, fromC, toR, toC) {
        const legalMoves = this.engine.getLegalMoves(fromR, fromC);
        const candidateMoves = legalMoves.filter(m => m.to.r === toR && m.to.c === toC);

        if (candidateMoves.length === 0) {
            this.selectedSquare = null;
            this.legalMovesForSelected = [];
            this.renderBoard();
            return;
        }

        // Check if promotion
        if (candidateMoves.some(m => m.promotion)) {
            this.pendingPromotion = { from: { r: fromR, c: fromC }, to: { r: toR, c: toC }, candidates: candidateMoves };
            this.showPromotionModal(this.engine.turn);
            return;
        }

        const move = candidateMoves[0];
        this.selectedSquare = null;
        this.legalMovesForSelected = [];
        this.lastMove = move;
        this.onMove(move);
    }

    showPromotionModal(color) {
        this.promotionChoicesEl.innerHTML = '';
        const pieces = [
            { type: QUEEN, label: 'Queen' },
            { type: KNIGHT, label: 'Knight' },
            { type: ROOK, label: 'Rook' },
            { type: BISHOP, label: 'Bishop' }
        ];

        pieces.forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'promotion-btn';
            btn.innerHTML = `
                <div class="promo-piece-svg">${getPieceSvg(`${color}${p.type.toUpperCase()}`)}</div>
                <span>${p.label}</span>
            `;
            btn.addEventListener('click', () => {
                this.hidePromotionModal();
                if (this.pendingPromotion) {
                    const chosen = this.pendingPromotion.candidates.find(m => m.promotion === p.type);
                    this.pendingPromotion = null;
                    if (chosen) {
                        this.selectedSquare = null;
                        this.legalMovesForSelected = [];
                        this.lastMove = chosen;
                        this.onMove(chosen);
                    }
                }
            });
            this.promotionChoicesEl.appendChild(btn);
        });

        this.promotionModalEl.classList.remove('hidden');
    }

    hidePromotionModal() {
        this.promotionModalEl.classList.add('hidden');
    }

    showNewGameModal() {
        document.getElementById('new-game-modal')?.classList.remove('hidden');
    }

    hideNewGameModal() {
        document.getElementById('new-game-modal')?.classList.add('hidden');
    }

    showGameOverModal(title, description) {
        this.gameOverTitleEl.textContent = title;
        this.gameOverDescEl.textContent = description;
        this.gameOverModalEl.classList.remove('hidden');
    }

    hideGameOverModal() {
        this.gameOverModalEl.classList.add('hidden');
    }

    setAiThinking(thinking) {
        if (this.aiThinkingEl) {
            if (thinking) {
                this.aiThinkingEl.classList.remove('hidden');
            } else {
                this.aiThinkingEl.classList.add('hidden');
            }
        }
    }

    updateStatus(engine, playerColor) {
        const status = engine.getGameStatus();
        const isWhiteTurn = engine.turn === WHITE;

        // Turn indicator
        if (this.turnIndicatorEl) {
            this.turnIndicatorEl.textContent = isWhiteTurn ? "White's Turn" : "Black's Turn";
            this.turnIndicatorEl.className = `turn-indicator ${isWhiteTurn ? 'white-turn' : 'black-turn'}`;
        }

        // Status badge
        if (this.statusBadgeEl) {
            if (status.isOver) {
                if (status.reason === 'checkmate') {
                    const winnerName = status.winner === playerColor ? 'You Win!' : 'AI Wins!';
                    this.statusBadgeEl.textContent = `Checkmate! ${winnerName}`;
                    this.statusBadgeEl.className = 'status-badge mate';
                } else {
                    this.statusBadgeEl.textContent = `Draw (${status.reason})`;
                    this.statusBadgeEl.className = 'status-badge draw';
                }
            } else if (status.inCheck) {
                this.statusBadgeEl.textContent = 'Check!';
                this.statusBadgeEl.className = 'status-badge check';
            } else {
                this.statusBadgeEl.textContent = 'Game in Progress';
                this.statusBadgeEl.className = 'status-badge playing';
            }
        }

        // Update captured pieces & material advantage
        const captured = engine.getCapturedPieces();
        this._renderCapturedPieces(this.capturedWhiteEl, captured.whiteCaptured);
        this._renderCapturedPieces(this.capturedBlackEl, captured.blackCaptured);

        if (this.materialAdvWhiteEl && this.materialAdvBlackEl) {
            const adv = captured.materialAdvantage;
            if (adv > 0) {
                this.materialAdvWhiteEl.textContent = `+${adv}`;
                this.materialAdvWhiteEl.classList.remove('hidden');
                this.materialAdvBlackEl.classList.add('hidden');
            } else if (adv < 0) {
                this.materialAdvBlackEl.textContent = `+${Math.abs(adv)}`;
                this.materialAdvBlackEl.classList.remove('hidden');
                this.materialAdvWhiteEl.classList.add('hidden');
            } else {
                this.materialAdvWhiteEl.classList.add('hidden');
                this.materialAdvBlackEl.classList.add('hidden');
            }
        }

        // Update move history
        this._renderMoveHistory(engine.history);
    }

    _renderCapturedPieces(container, pieces) {
        if (!container) return;
        container.innerHTML = '';
        // Sort captured pieces by value
        const order = { q: 5, r: 4, b: 3, n: 2, p: 1 };
        pieces.sort((a, b) => order[b.type] - order[a.type]);

        for (const p of pieces) {
            const span = document.createElement('span');
            span.className = 'captured-piece-icon';
            span.innerHTML = getPieceSvg(`${p.color}${p.type.toUpperCase()}`);
            container.appendChild(span);
        }
    }

    _renderMoveHistory(history) {
        if (!this.moveListEl) return;
        this.moveListEl.innerHTML = '';

        for (let i = 0; i < history.length; i += 2) {
            const moveRow = document.createElement('div');
            moveRow.className = 'move-row';

            const moveNum = document.createElement('span');
            moveNum.className = 'move-num';
            moveNum.textContent = `${Math.floor(i / 2) + 1}.`;
            moveRow.appendChild(moveNum);

            // White move
            const whiteMove = document.createElement('span');
            whiteMove.className = `move-san ${i === history.length - 1 ? 'current-move' : ''}`;
            whiteMove.textContent = history[i].san;
            moveRow.appendChild(whiteMove);

            // Black move
            if (i + 1 < history.length) {
                const blackMove = document.createElement('span');
                blackMove.className = `move-san ${i + 1 === history.length - 1 ? 'current-move' : ''}`;
                blackMove.textContent = history[i + 1].san;
                moveRow.appendChild(blackMove);
            }

            this.moveListEl.appendChild(moveRow);
        }

        // Scroll to bottom
        this.moveListEl.scrollTop = this.moveListEl.scrollHeight;
    }

    showToast(message, duration = 2500) {
        if (!this.toastEl) return;
        this.toastEl.textContent = message;
        this.toastEl.classList.remove('hidden');
        clearTimeout(this._toastTimeout);
        this._toastTimeout = setTimeout(() => {
            this.toastEl.classList.add('hidden');
        }, duration);
    }
}


    // ==========================================
    // 6. Main Application Coordinator
    // ==========================================
/**
 * Chess Web App - Main Application Coordinator
 * Connects the ChessEngine, ChessAI (via Web Worker with fallback), SoundEffects, and ChessUI.
 */





class ChessApp {
    constructor() {
        this.engine = new ChessEngine();
        this.playerColor = WHITE;
        this.difficulty = 3;
        this.isAiThinking = false;
        this.isGameOver = false;

        this.fallbackAi = new ChessAI(this.difficulty);
        this.worker = null;
        this.workerRequestId = 0;

        this.worker = null; // Standalone single-file mode uses async main-thread execution
        this._initUI();
        this.startNewGame({ side: 'white', difficulty: 3 });
    }

    _initWorker() {
        try {
            // Check if Web Worker can be created as a module
            this.worker = new Worker('./js/ai-worker.js', { type: 'module' });
            this.worker.onmessage = (e) => this._handleWorkerMessage(e);
            this.worker.onerror = (err) => {
                console.warn('Web Worker error, falling back to main-thread AI:', err);
                this.worker = null;
            };
        } catch (e) {
            console.warn('Could not initialize Web Worker (running on file:// or unsupported), using main-thread fallback:', e);
            this.worker = null;
        }
    }

    _initUI() {
        this.ui = new ChessUI({
            onMove: (move) => this.handlePlayerMove(move),
            onPromotionSelect: (pieceType) => {},
            onNewGame: (config) => this.startNewGame(config),
            onUndo: () => this.handleUndo(),
            onFlipBoard: (flipped) => {},
            onMuteToggle: (btn) => this.handleMuteToggle(btn),
            onExportPgn: () => this.handleExportPgn(),
            onCopyFen: () => this.handleCopyFen(),
            onDifficultyChange: (diff) => this.handleDifficultyChange(diff)
        });

        this.ui.setEngine(this.engine);
    }

    startNewGame({ side = 'white', difficulty = 3 }) {
        this.engine = new ChessEngine();
        this.difficulty = difficulty;
        this.fallbackAi.setDifficulty(difficulty);
        this.isAiThinking = false;
        this.isGameOver = false;

        if (side === 'random') {
            this.playerColor = Math.random() < 0.5 ? WHITE : BLACK;
        } else {
            this.playerColor = side === 'black' ? BLACK : WHITE;
        }

        // Set board flip based on chosen side
        const shouldFlip = this.playerColor === BLACK;
        this.ui.setEngine(this.engine);
        this.ui.lastMove = null;
        this.ui.selectedSquare = null;
        this.ui.legalMovesForSelected = [];
        this.ui.setFlipped(shouldFlip);
        this.ui.setAiThinking(false);

        // Sync difficulty selector UI
        const diffSelect = document.getElementById('ai-difficulty-select');
        if (diffSelect) diffSelect.value = String(difficulty);

        this._updateGameState();

        // If player is Black, AI moves first as White
        if (this.playerColor === BLACK) {
            this._triggerAiMove();
        }
    }

    handlePlayerMove(move) {
        if (this.isAiThinking || this.isGameOver) return;
        if (this.engine.turn !== this.playerColor) return;

        const result = this.engine.makeMove(move);
        if (!result) return;

        // Play appropriate sound
        this._playSoundForMove(result);

        this._updateGameState();

        // If game continues, trigger AI turn
        if (!this.isGameOver) {
            this._triggerAiMove();
        }
    }

    _playSoundForMove(result) {
        const { move, capturedPiece } = result;
        const status = this.engine.getGameStatus();

        if (status.isOver) {
            if (status.reason === 'checkmate') {
                if (status.winner === this.playerColor) {
                    sound.playVictory();
                } else {
                    sound.playDefeat();
                }
            } else {
                sound.playDraw();
            }
            return;
        }

        if (status.inCheck) {
            sound.playCheck();
            return;
        }

        if (capturedPiece) {
            sound.playCapture();
        } else if (move.isCastle) {
            sound.playCastle();
        } else {
            sound.playMove();
        }
    }

    _triggerAiMove() {
        if (this.isGameOver) return;
        this.isAiThinking = true;
        this.ui.setAiThinking(true);

        const currentFen = this.engine.getFen();
        this.workerRequestId++;
        const currentReqId = this.workerRequestId;

        if (this.worker) {
            // Worker search
            this.worker.postMessage({
                type: 'SEARCH_MOVE',
                fen: currentFen,
                difficulty: this.difficulty,
                id: currentReqId
            });
        } else {
            // Asynchronous fallback on main thread
            setTimeout(() => {
                if (this.workerRequestId !== currentReqId) return; // Stale request cancelled
                try {
                    const result = this.fallbackAi.findBestMove(this.engine);
                    this._executeAiMove(result ? result.move : null);
                } catch (err) {
                    console.error('Error executing AI move:', err);
                } finally {
                    this.isAiThinking = false;
                    this.ui.setAiThinking(false);
                }
            }, 60);
        }
    }

    _handleWorkerMessage(e) {
        const { id, success, bestMove, error } = e.data;
        if (id !== this.workerRequestId) return; // Discard outdated search

        this.isAiThinking = false;
        this.ui.setAiThinking(false);

        if (!success) {
            console.error('AI worker error:', error);
            return;
        }

        this._executeAiMove(bestMove);
    }

    _executeAiMove(move) {
        if (!move || this.isGameOver) return;

        this.ui.lastMove = move;
        const result = this.engine.makeMove(move);
        if (!result) return;

        this._playSoundForMove(result);
        this._updateGameState();
    }

    _updateGameState() {
        this.ui.renderBoard();
        this.ui.updateStatus(this.engine, this.playerColor);

        const status = this.engine.getGameStatus();
        if (status.isOver) {
            this.isGameOver = true;
            let title = '';
            let desc = '';

            if (status.reason === 'checkmate') {
                if (status.winner === this.playerColor) {
                    title = 'Victory!';
                    desc = `Congratulations! You checkmated the AI in ${this.engine.fullMoveNumber} moves.`;
                } else {
                    title = 'Checkmate!';
                    desc = `The AI checkmated your king in ${this.engine.fullMoveNumber} moves. Better luck next time!`;
                }
            } else if (status.reason === 'stalemate') {
                title = 'Stalemate!';
                desc = 'The game is a draw because the active player has no legal moves and is not in check.';
            } else if (status.reason === 'fifty-move rule') {
                title = 'Draw!';
                desc = '50 consecutive moves have occurred without a capture or pawn advance.';
            } else if (status.reason === 'threefold repetition') {
                title = 'Draw!';
                desc = 'The exact same board position has repeated 3 times.';
            } else if (status.reason === 'insufficient material') {
                title = 'Draw!';
                desc = 'Neither player has sufficient material left to deliver checkmate.';
            }

            setTimeout(() => {
                this.ui.showGameOverModal(title, desc);
            }, 500);
        }
    }

    handleUndo() {
        if (this.isGameOver) {
            this.isGameOver = false;
        }

        // Cancel any pending AI search
        this.workerRequestId++;
        this.isAiThinking = false;
        this.ui.setAiThinking(false);

        if (this.engine.history.length === 0) {
            this.ui.showToast('No moves to undo!');
            return;
        }

        // If it's player's turn, undo both the AI's move and the player's previous move
        if (this.engine.turn === this.playerColor) {
            this.engine.undoMove();
            if (this.engine.history.length > 0) {
                this.engine.undoMove();
            }
        } else {
            // If it's AI's turn (e.g. undo clicked quickly after player move), undo 1 move
            this.engine.undoMove();
        }

        // Update last move highlight from history
        const lastHist = this.engine.history[this.engine.history.length - 1];
        this.ui.lastMove = lastHist ? lastHist.move : null;
        this.ui.selectedSquare = null;
        this.ui.legalMovesForSelected = [];

        this._updateGameState();
        this.ui.showToast('Move undone');

        // If player is Black and board is reset to move 1, trigger AI move again
        if (this.playerColor === BLACK && this.engine.history.length === 0) {
            this._triggerAiMove();
        }
    }

    handleMuteToggle(buttonEl) {
        const isMuted = sound.toggleMute();
        if (buttonEl) {
            buttonEl.innerHTML = isMuted
                ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg><span>Unmute</span>'
                : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg><span>Mute</span>';
        }
        this.ui.showToast(isMuted ? 'Sound muted' : 'Sound enabled');
    }

    handleExportPgn() {
        const pgn = this.engine.getPgn({
            White: this.playerColor === WHITE ? 'Player' : `AI (Level ${this.difficulty})`,
            Black: this.playerColor === BLACK ? 'Player' : `AI (Level ${this.difficulty})`
        });

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(pgn).then(() => {
                this.ui.showToast('PGN copied to clipboard!');
            }).catch(() => {
                this._promptCopyFallback(pgn, 'PGN');
            });
        } else {
            this._promptCopyFallback(pgn, 'PGN');
        }
    }

    handleCopyFen() {
        const fen = this.engine.getFen();
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(fen).then(() => {
                this.ui.showToast('FEN copied to clipboard!');
            }).catch(() => {
                this._promptCopyFallback(fen, 'FEN');
            });
        } else {
            this._promptCopyFallback(fen, 'FEN');
        }
    }

    _promptCopyFallback(text, label) {
        window.prompt(`Copy ${label}:`, text);
    }

    handleDifficultyChange(diff) {
        this.difficulty = diff;
        this.fallbackAi.setDifficulty(diff);
        if (this.worker) {
            this.worker.postMessage({ type: 'SET_DIFFICULTY', difficulty: diff });
        }
        this.ui.showToast(`AI Difficulty set to Level ${diff}`);
    }
}

// Instantiate application once DOM is loaded
window.addEventListener('DOMContentLoaded', () => {
    window.chessApp = new ChessApp();
});

})();
